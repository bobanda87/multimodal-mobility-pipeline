AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Incremental normalization (watermark based) and daily compaction of the normalized Parquet files, as scheduled Lambda container functions.

Parameters:
  BucketName:
    Type: String
    Default: phdprojectdata
  ParquetPath:
    Type: String
    Default: data/parquet
  JsonPath:
    Type: String
    Default: data/json
    Description: Where normalization_watermark.json lives
  NormalizeEveryMinutes:
    Type: Number
    Default: 1
    MinValue: 1
    Description: How often new raw files are normalized, in minutes; this is the extra delay before they reach the API
  # Schedules are created DISABLED; check a manual invocation first, then deploy with ENABLED.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: State of the normalization schedule
  CompactScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: State of the daily compaction schedule, kept separate so it stays off until you want it
  HourlyCompactScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: State of the hourly compaction schedule (runs at minute 10 and merges the previous closed hour)

Conditions:
  SingularMinute: !Equals [!Ref NormalizeEveryMinutes, 1]  # rate() wants 'minute' for 1 and 'minutes' otherwise

Globals:
  Function:
    Architectures: [arm64]
    Environment:
      Variables:
        S3_BUCKET_NAME: !Ref BucketName
        S3_PARQUET_PATH: !Ref ParquetPath
        S3_JSON_PATH: !Ref JsonPath
        # Raw object keys use the collectors' local date (they run with this zone)
        TZ: Europe/Oslo

Resources:
  NormalizeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: normalizer/Dockerfile
      DockerContext: ..
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["normalizer.handler.normalize_handler"]
      # Overlapping runs are prevented by an S3 lock in normalizer/handler.py, so the timeout may exceed the
      # schedule interval (a catch-up after an outage can take several minutes).
      Timeout: 900
      MemorySize: 3008
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !If [SingularMinute, "rate(1 minute)", !Sub "rate(${NormalizeEveryMinutes} minutes)"]
            State: !Ref ScheduleState

  CompactFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: normalizer/Dockerfile
      DockerContext: ..
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["normalizer.handler.compact_handler"]
      Timeout: 900
      MemorySize: 3008  # the account's default per-function maximum; raise it (and this) via a Lambda quota request
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 3 * * ? *)
            ScheduleExpressionTimezone: Europe/Oslo
            State: !Ref CompactScheduleState

  CompactHourlyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: normalizer/Dockerfile
      DockerContext: ..
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["normalizer.handler.compact_hourly_handler"]
      Timeout: 900
      MemorySize: 2048
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(10 * * * ? *)
            State: !Ref HourlyCompactScheduleState

  NormalizeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NormalizeFunction}"
      RetentionInDays: 7
  CompactLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CompactFunction}"
      RetentionInDays: 7
  CompactHourlyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CompactHourlyFunction}"
      RetentionInDays: 7
